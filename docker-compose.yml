services:
    db:
        image: postgres:16
        container_name: laremise-db

        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}

        ports:
            - "5432:5432"

        volumes:
            - ./db/migration_up.sql:/docker-entrypoint-initdb.d/01-migration_up.sql
            - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
            - laremise-data:/var/lib/postgresql/data

volumes:
    laremise-data:
